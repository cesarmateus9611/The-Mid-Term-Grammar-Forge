<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mid-Term Grammar Forge v2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        h1 { color: #0be881; text-transform: uppercase; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #bdc3c7; font-style: italic; margin-bottom: 20px; text-align: center; }
        
        .container { background: #ecf0f1; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); max-width: 800px; width: 100%; color: #2c3e50; text-align: center; min-height: 350px;}
        
        /* Navigation */
        .nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .nav-btn { background: #34495e; color: white; border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .nav-btn:hover, .nav-btn.active { background: #e67e22; }
        
        .module { display: none; animation: fadeIn 0.3s ease-in; }
        .module.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Game UI */
        .question-box { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #2c3e50; line-height: 1.4; }
        .options-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .opt-btn { background: #3498db; color: white; padding: 15px 25px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 4px 0 #2980b9; }
        .opt-btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 #2980b9; }
        
        .feedback { font-size: 20px; font-weight: bold; margin-top: 15px; min-height: 30px; }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
        
        .progress { color: #7f8c8d; font-weight: bold; margin-bottom: 10px; }
        .btn-restart { background: #27ae60; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <h1>🔨 Mid-Term Grammar Forge v2</h1>
    <div class="subtitle">Intermediate 2 - 16 Exercises per Challenge!</div>

    <div class="container">
        <div class="nav">
            <button class="nav-btn active" onclick="switchModule('suffix')">1. The Suffix Builder</button>
            <button class="nav-btn" onclick="switchModule('timeline')">2. The Timeline Clash</button>
        </div>

        <!-- SUFFIX BUILDER -->
        <div id="suffix" class="module active">
            <div class="progress">Question <span id="suf-prog">1</span> of 16</div>
            <div class="question-box">Root word: <span id="suf-root" style="color:#e67e22; font-size: 32px;">COMFORT</span></div>
            <p style="font-weight:bold;">Select the correct suffix to make an adjective:</p>
            <div class="options-grid" id="suf-opts"></div>
            <div id="suf-feed" class="feedback"></div>
            <button id="suf-restart" class="btn-restart" onclick="restartSuffix()">Play Again</button>
        </div>

        <!-- TIMELINE CLASH -->
        <div id="timeline" class="module">
            <div class="progress">Question <span id="time-prog">1</span> of 16</div>
            <div class="question-box" id="time-q">Loading...</div>
            <p style="font-weight:bold;">Which option completes the sentence correctly?</p>
            <div class="options-grid" id="time-opts"></div>
            <div id="time-feed" class="feedback"></div>
            <button id="time-restart" class="btn-restart" onclick="restartTimeline()">Play Again</button>
        </div>
    </div>

    <script>
        // Navigation
        function switchModule(modId) {
            document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(modId).classList.add('active');
            event.target.classList.add('active');
        }

        // Utility: Shuffle Array
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // --- SUFFIX DATA (16 Items) ---
        const masterSufData = [
            { root: "COMFORT", opts: ["-able", "-ful", "-ic", "-ive"], ans: "-able" },
            { root: "VALUE", opts: ["-able", "-ful", "-y", "-ic"], ans: "-able" },
            { root: "USE", opts: ["-ive", "-ful", "-able", "-ic"], ans: "-ful" },
            { root: "ACT", opts: ["-able", "-ic", "-ive", "-y"], ans: "-ive" },
            { root: "NOISE", opts: ["-ful", "-ic", "-able", "-y"], ans: "-y" },
            { root: "ARTIST", opts: ["-ic", "-ive", "-able", "-ful"], ans: "-ic" },
            { root: "HELP", opts: ["-y", "-ful", "-able", "-ive"], ans: "-ful" },
            { root: "CREATE", opts: ["-able", "-y", "-ic", "-ive"], ans: "-ive" },
            { root: "DIRT", opts: ["-y", "-ic", "-able", "-ful"], ans: "-y" },
            { root: "LOGIC", opts: ["-ic", "-ive", "-ful", "-able"], ans: "-ic" },
            { root: "REASON", opts: ["-ive", "-ful", "-able", "-y"], ans: "-able" },
            { root: "CARE", opts: ["-y", "-ic", "-ful", "-ive"], ans: "-ful" },
            { root: "ATTRACT", opts: ["-ive", "-able", "-ful", "-ic"], ans: "-ive" },
            { root: "DUST", opts: ["-y", "-ic", "-ful", "-able"], ans: "-y" },
            { root: "MAGIC", opts: ["-ic", "-ive", "-able", "-y"], ans: "-ic" },
            { root: "SUSTAIN", opts: ["-ful", "-able", "-ive", "-ic"], ans: "-able" }
        ];
        
        let sufData = [];
        let sufIdx = 0;

        function restartSuffix() {
            sufData = shuffle([...masterSufData]);
            sufIdx = 0;
            document.getElementById('suf-restart').style.display = 'none';
            loadSuffix();
        }

        function loadSuffix() {
            if (sufIdx >= sufData.length) {
                document.getElementById('suf-root').innerText = "🏆 MASTER OF SUFFIXES!";
                document.getElementById('suf-opts').innerHTML = "";
                document.getElementById('suf-prog').innerText = 16;
                document.getElementById('suf-restart').style.display = 'inline-block';
                return;
            }
            document.getElementById('suf-prog').innerText = sufIdx + 1;
            const current = sufData[sufIdx];
            document.getElementById('suf-root').innerText = current.root;
            const optsDiv = document.getElementById('suf-opts');
            optsDiv.innerHTML = "";
            
            let shuffledOpts = shuffle([...current.opts]);
            shuffledOpts.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkSuffix(opt, current.ans);
                optsDiv.appendChild(btn);
            });
        }

        function checkSuffix(selected, ans) {
            const feed = document.getElementById('suf-feed');
            if (selected === ans) {
                feed.innerText = `✅ Correct! ${sufData[sufIdx].root}${ans.replace('-','')}`; 
                feed.className = "feedback correct";
                setTimeout(() => { feed.innerText = ""; sufIdx++; loadSuffix(); }, 1200);
            } else {
                feed.innerText = "❌ Incorrect! Check your notes."; 
                feed.className = "feedback incorrect";
                setTimeout(() => feed.innerText = "", 1200);
            }
        }

        // --- TIMELINE DATA (16 Items) ---
        const masterTimeData = [
            { q: "I ________ a valuable wooden chair yesterday.", opts: ["bought", "have bought"], ans: "bought" },
            { q: "How long ________ that comfortable cotton jacket?", opts: ["did you have", "have you had"], ans: "have you had" },
            { q: "We ________ the community Maloca in 2021.", opts: ["have built", "built"], ans: "built" },
            { q: "She ________ very active in the eco-project since January.", opts: ["was", "has been"], ans: "has been" },
            { q: "When ________ the plastic pollution in the river?", opts: ["did you see", "have you seen"], ans: "did you see" },
            { q: "They ________ the contaminated beach three years ago.", opts: ["cleaned", "have cleaned"], ans: "cleaned" },
            { q: "________ a tree in your local park?", opts: ["Have you ever planted", "Did you ever planted"], ans: "Have you ever planted" },
            { q: "My grandfather ________ this glass bottle when he was a teenager.", opts: ["found", "has found"], ans: "found" },
            { q: "I ________ meat since I learned about 'Buen Vivir'.", opts: ["didn't eat", "haven't eaten"], ans: "haven't eaten" },
            { q: "How did the environmental festival ________?", opts: ["start", "started"], ans: "start" },
            { q: "We ________ all the plastic waste yet.", opts: ["didn't recycle", "haven't recycled"], ans: "haven't recycled" },
            { q: "She ________ her useful cotton bag to the supermarket last night.", opts: ["has taken", "took"], ans: "took" },
            { q: "________ you ________ that silver ring for a long time?", opts: ["Have / had", "Did / have"], ans: "Have / had" },
            { q: "The local artisans ________ beautiful things with recycled metal in 2022.", opts: ["created", "have created"], ans: "created" },
            { q: "I ________ water because it is a sacred resource.", opts: ["have never wasted", "haven't never wasted"], ans: "have never wasted" },
            { q: "He ________ his habits to protect the earth two months ago.", opts: ["changed", "has changed"], ans: "changed" }
        ];
        
        let timeData = [];
        let timeIdx = 0;

        function restartTimeline() {
            timeData = shuffle([...masterTimeData]);
            timeIdx = 0;
            document.getElementById('time-restart').style.display = 'none';
            loadTimeline();
        }

        function loadTimeline() {
            if (timeIdx >= timeData.length) {
                document.getElementById('time-q').innerText = "🏆 TIMELINE MASTER!";
                document.getElementById('time-opts').innerHTML = "";
                document.getElementById('time-prog').innerText = 16;
                document.getElementById('time-restart').style.display = 'inline-block';
                return;
            }
            document.getElementById('time-prog').innerText = timeIdx + 1;
            const current = timeData[timeIdx];
            document.getElementById('time-q').innerText = current.q;
            const optsDiv = document.getElementById('time-opts');
            optsDiv.innerHTML = "";
            
            let shuffledOpts = shuffle([...current.opts]);
            shuffledOpts.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkTimeline(opt, current.ans);
                optsDiv.appendChild(btn);
            });
        }

        function checkTimeline(selected, ans) {
            const feed = document.getElementById('time-feed');
            if (selected === ans) {
                feed.innerText = "✅ Perfect Timeline!"; 
                feed.className = "feedback correct";
                setTimeout(() => { feed.innerText = ""; timeIdx++; loadTimeline(); }, 1200);
            } else {
                feed.innerText = "❌ Error! Check the time markers."; 
                feed.className = "feedback incorrect";
                setTimeout(() => feed.innerText = "", 1500);
            }
        }

        // Initialize both modules
        restartSuffix();
        restartTimeline();
    </script>
</body>
</html>
